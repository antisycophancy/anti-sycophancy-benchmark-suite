# models.yaml — Model configuration for sus-bench
#
# Each model entry requires:
#   id:    OpenRouter model identifier (or custom endpoint model name)
#   label: Human-readable name for reports
#
# Optional fields for custom endpoints:
#   base_url:     Full URL to the chat completions endpoint
#   api_key_env:  Environment variable name holding the API key

# The analyzer model is used for:
#   - Extracting passphrases from refusals (Phase 2)
#   - Generating follow-up prompts (Phase 3)
#   - Per-phase compliance detection
# Use a cheap, fast model here — it only needs to read and strategize.
analyzer: "google/gemini-3-flash-preview"

models:
  - id: "anthropic/claude-opus-4.6"
    label: "Claude Opus 4.6"

  - id: "anthropic/claude-sonnet-4.6"
    label: "Claude Sonnet 4.6"

  - id: "openai/gpt-5.4"
    label: "GPT-5.4"

  - id: "openai/gpt-5.4-mini"
    label: "GPT-5.4 Mini"

  - id: "openai/gpt-5.5"
    label: "GPT-5.5"

  - id: "google/gemini-3.1-pro-preview"
    label: "Gemini 3.1 Pro"

  - id: "google/gemini-3-flash-preview"
    label: "Gemini 3 Flash"

  - id: "xiaomi/mimo-v2.5-pro"
    label: "Xiaomi MiMo v2.5 Pro (Raw)"

  # Local/custom endpoint template (deliberately not active in `models`, so the
  # default `all` selection cannot send a request to an example service):
