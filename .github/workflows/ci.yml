name: release-install

# Offline, no-paid-call verification. Runs on main pushes and all PRs (incl. forks).
# No secrets needed: nothing here contacts a model provider — paid/live runs
# are intentionally excluded from CI.
# The former developer commands `./venv/bin/pip install -c constraints.txt --upgrade pip`
# and `-e '.[adapter]'` are intentionally not used here: bootstrap installs the
# release lock with hashes, then the four local packages with no dependency lookup.

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  offline-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Export a clean source tree
        run: |
          source_dir="$RUNNER_TEMP/antisycophancy-source"
          release_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          scripts/export-release --sha "$GITHUB_SHA" --out "$source_dir" --release-version "$release_version"
          echo "SOURCE_DIR=$source_dir" >> "$GITHUB_ENV"

      - name: Bootstrap the exported source
        env:
          PYTHONPATH: ""
          PYTHON_BIN: python
        run: cd "$SOURCE_DIR" && ./scripts/bootstrap

      - name: Exercise installed command surfaces
        env:
          PYTHONPATH: ""
        run: |
          cd "$SOURCE_DIR"
          ./venv/bin/bench --help
          ./venv/bin/sus-bench --help
          ./venv/bin/sus-bench --version
          ./venv/bin/python -m sus_bench.cli --version
          ./venv/bin/aita-bench --help
          ./venv/bin/aita-bench --version
          ./venv/bin/epis-bench --help
          ./venv/bin/epis-bench --version

      - name: Validate central model config
        env:
          PYTHONPATH: ""
        run: cd "$SOURCE_DIR" && ./venv/bin/python -m suite_tools.model_config --validate

      - name: Offline gate (all modules + shared tests)
        env:
          PYTHONPATH: ""
        run: cd "$SOURCE_DIR" && ./venv/bin/python -m suite_tools.offline_gate

      - name: Release-surface audit
        env:
          PYTHONPATH: ""
        run: cd "$SOURCE_DIR" && ./venv/bin/python -m suite_tools.release_audit

      - name: Dependency vulnerability audit
        env:
          PYTHONPATH: ""
        run: cd "$SOURCE_DIR" && ./venv/bin/pip-audit --local --skip-editable

      - name: Static security scan
        env:
          PYTHONPATH: ""
        run: cd "$SOURCE_DIR" && ./venv/bin/bandit -q -ll -r suite_tools adapter sus-bench/sus_bench aita-bench/aita_bench epistemic-sycophancy-bench/epis_bench

  macos-release-smoke:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Export a clean macOS source tree
        run: |
          source_dir="$RUNNER_TEMP/antisycophancy-source"
          release_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          scripts/export-release --sha "$GITHUB_SHA" --out "$source_dir" --release-version "$release_version"
          echo "SOURCE_DIR=$source_dir" >> "$GITHUB_ENV"

      - name: Bootstrap the hashed macOS release
        env:
          PYTHONPATH: ""
          PYTHON_BIN: python
        run: cd "$SOURCE_DIR" && ./scripts/bootstrap

      - name: Exercise sealed-pack cryptography on macOS
        env:
          PYTHONPATH: ""
        run: cd "$SOURCE_DIR" && ./venv/bin/python -m pytest -q tests/test_sealed_pack.py
