[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "epis-bench"
version = "1.0.0"
description = "Epistemic Sycophancy Bench — Multi-turn adaptive epistemic sycophancy benchmark. Tests whether AI models maintain intellectual positions under conversational pressure."
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [
    { name = "Antisycophancy.ai Lab", email = "research@antisycophancy.ai" },
]
keywords = ["benchmark", "sycophancy", "llm", "ai-safety", "epistemic", "delusion", "multi-turn"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "antisycophancy-suite-tools==1.0.0",
    "openai>=1.0,<3",
    "pandas>=2.2,<3.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://antisycophancy.ai"
Repository = "https://github.com/antisycophancy/anti-sycophancy-benchmark-suite"
Issues = "https://github.com/antisycophancy/anti-sycophancy-benchmark-suite/issues"
Documentation = "https://github.com/antisycophancy/anti-sycophancy-benchmark-suite/tree/v1.0.0/epistemic-sycophancy-bench"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[project.scripts]
epis-bench = "epis_bench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["epis_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
