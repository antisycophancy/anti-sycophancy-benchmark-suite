schema_version: 1
description: "Central model, endpoint, judge, and agent config for the unified benchmark suite."

defaults:
  endpoint: openrouter
  max_parallel: 3

endpoints:
  openrouter:
    provider_api: openai_compatible
    openai_base_url: "https://openrouter.ai/api/v1"
    chat_completions_url: "https://openrouter.ai/api/v1/chat/completions"
    api_key_env: "OPENROUTER_API_KEY"
  local_openai_compatible:
    provider_api: openai_compatible
    openai_base_url: "http://localhost:9999/v1"
    chat_completions_url: "http://localhost:9999/v1/chat/completions"
    api_key_env: "LOCAL_OPENAI_COMPATIBLE_API_KEY"
  openai_native:
    provider_api: openai_compatible
    openai_base_url: "https://api.openai.com/v1"
    chat_completions_url: "https://api.openai.com/v1/chat/completions"
    api_key_env: "OPENAI_API_KEY"
  openai_responses:
    # Native OpenAI Responses API. Chat Completions rejects reasoning
    # effort=max for the gpt-5.6 tiers; /v1/responses accepts the full
    # none..max range, so the gpt-5.6 family routes here.
    provider_api: openai_responses
    responses_url: "https://api.openai.com/v1/responses"
    api_key_env: "OPENAI_API_KEY"
  anthropic_native:
    provider_api: anthropic_messages
    messages_url: "https://api.anthropic.com/v1/messages"
    api_key_env: "ANTHROPIC_API_KEY"
  google_gemini_native:
    provider_api: gemini_generate_content
    generate_content_base_url: "https://generativelanguage.googleapis.com/v1beta"
    api_key_env: "GEMINI_API_KEY"

agents:
  analyzer:
    model_id: "google/gemini-3-flash-preview"
    role: "SUS passphrase extraction, follow-up generation, and adaptive escalation"
  seeker:
    model_id: "google/gemini-3-flash-preview"
    role: "Adaptive follow-up pressure generation"
  flip_generator:
    model_id: "google/gemini-3-flash-preview"
    role: "AITA side-B conflict generation"

module_agents:
  aita:
    seeker:
      model_id: "google/gemini-3-flash-preview"
      role: "AITA adaptive follow-up pressure generation"
    flip_generator:
      model_id: "google/gemini-3-flash-preview"
      role: "AITA side-B conflict generation"

agent_profiles:
  gemini_3_flash_preview:
    description: "Historical generator/analyzer baseline."
    agents:
      analyzer:
        model_id: "google/gemini-3-flash-preview"
        role: "SUS passphrase extraction, follow-up generation, and adaptive escalation"
      seeker:
        model_id: "google/gemini-3-flash-preview"
        role: "Adaptive follow-up pressure generation"
      flip_generator:
        model_id: "google/gemini-3-flash-preview"
        role: "AITA side-B conflict generation"
  gemini_35_flash:
    description: "Fast Google workhorse candidate."
    agents:
      analyzer:
        model_id: "google/gemini-3.5-flash"
        role: "SUS passphrase extraction, follow-up generation, and adaptive escalation"
      seeker:
        model_id: "google/gemini-3.5-flash"
        role: "Adaptive follow-up pressure generation"
      flip_generator:
        model_id: "google/gemini-3.5-flash"
        role: "AITA side-B conflict generation"
  haiku_45:
    description: "Anthropic workhorse pressure-writer profile."
    agents:
      analyzer:
        model_id: "anthropic/claude-haiku-4.5"
        role: "SUS passphrase extraction, follow-up generation, and adaptive escalation"
      seeker:
        model_id: "anthropic/claude-haiku-4.5"
        role: "Adaptive follow-up pressure generation"
      flip_generator:
        model_id: "anthropic/claude-haiku-4.5"
        role: "AITA side-B conflict generation"
  sonnet_46:
    description: "Higher-cost Anthropic writer baseline for pressure-quality bakeoffs."
    agents:
      analyzer:
        model_id: "anthropic/claude-sonnet-4.6"
        role: "SUS passphrase extraction, follow-up generation, and adaptive escalation"
      seeker:
        model_id: "anthropic/claude-sonnet-4.6"
        role: "Adaptive follow-up pressure generation"
      flip_generator:
        model_id: "anthropic/claude-sonnet-4.6"
        role: "AITA side-B conflict generation"

judge_sets:
  calibration:
    description: "Low-cost single-judge path for smoke tests and prompt calibration."
    primary: "google/gemini-3.1-pro-preview"
    panel:
      - "google/gemini-3.1-pro-preview"
  frontier:
    description: "Higher-quality frontier judge set for rescoring and publication candidates."
    primary: "openai/gpt-5.5"
    panel:
      - "openai/gpt-5.5"
      # Keep Opus 4.7 in the Anthropic judge slot for continuity with historical judge calls.
      - "anthropic/claude-opus-4.7"
      - "google/gemini-3.1-pro-preview"
  direct_calibration_high:
    description: "Single direct Gemini high-thinking judge for smoke and calibration scoring."
    primary: "judge-gemini-3-1-pro-native-high"
    panel:
      - "judge-gemini-3-1-pro-native-high"
  direct_frontier_high:
    description: "Direct provider high-thinking judge panel for publication-candidate rescoring."
    primary: "judge-gpt-5-5-native-high"
    panel:
      - "judge-gpt-5-5-native-high"
      - "judge-claude-opus-4-7-native-high"
      - "judge-gemini-3-1-pro-native-high"

judge_models:
  judge-gpt-5-5-native-high:
    model_id: "gpt-5.5"
    label: "GPT-5.5 / high reasoning / OpenAI native judge"
    endpoint: openai_native
    condition_id: "judge-gpt-5-5-openai-native-high-reasoning"
    condition_metadata:
      provider_route: "openai_native"
      role: "judge"
      effort: "high"
      effort_policy: "explicit_openai_reasoning_effort"
    request_options:
      max_tokens: 8192
      reasoning_effort: "high"
  judge-claude-opus-4-7-native-high:
    model_id: "claude-opus-4-7"
    label: "Claude Opus 4.7 / Anthropic native high-effort judge"
    endpoint: anthropic_native
    condition_id: "judge-claude-opus-4-7-anthropic-native-high"
    condition_metadata:
      provider_route: "anthropic_native"
      role: "judge"
      effort: "high"
      effort_policy: "explicit_anthropic_output_config"
    request_options:
      max_tokens: 4096
      thinking:
        type: "adaptive"
      output_config:
        effort: "high"
  judge-gemini-3-1-pro-native-high:
    model_id: "gemini-3.1-pro-preview"
    label: "Gemini 3.1 Pro / Google native high-thinking judge"
    endpoint: google_gemini_native
    condition_id: "judge-gemini-3-1-pro-google-native-high-thinking"
    condition_metadata:
      provider_route: "google_gemini_native"
      api_family: "generativelanguage.generateContent"
      role: "judge"
      effort: "high"
      effort_policy: "explicit_gemini_thinking_level"
      thinking_config_path: "generationConfig.thinkingConfig.thinkingLevel"
    request_options:
      generationConfig:
        maxOutputTokens: 8192
        thinkingConfig:
          includeThoughts: false
          thinkingLevel: "high"

model_groups:
  calibration_smoke:
    - "gemini-flash"
  flash_35_smoke:
    - "gemini-flash"
    - "gemini-3-5-flash"
  frontier_03_04:
    - "claude-opus-4-6"
    - "claude-opus-4-7"
    - "claude-sonnet-4-6"
    - "gpt-5-4"
    - "gpt-5-5"
    - "gemini-3-1-pro"
  official_core_20260605:
    - "gpt-chat-latest"
    - "gpt-5-5-native-default"
    - "gpt-5-5-native-high"
    - "claude-opus-4-8-native-provider-default"
    - "claude-opus-4-8-native-high"
    - "claude-opus-4-8-native-xhigh"
    - "gemini-3-1-pro"
    - "gemini-3-1-pro-openrouter-high"
    - "gemini-3-5-flash"
  official_external_20260605:
    - "deepseek-v4-pro"
    - "deepseek-v3-2"
    - "mistral-large-2512"
    - "mistral-small-3-2"
    - "grok-4-20"
    - "qwen-3-6-plus"
    - "glm-5-1"
    - "kimi-k2-6"
    - "gemma-4-31b"
    - "nemotron-3-super"
    - "mimo-v2-5-pro"
  official_full_20260605:
    - "gpt-chat-latest"
    - "gpt-5-5-native-default"
    - "gpt-5-5-native-high"
    - "claude-opus-4-8-native-provider-default"
    - "claude-opus-4-8-native-high"
    - "claude-opus-4-8-native-xhigh"
    - "gemini-3-1-pro"
    - "gemini-3-1-pro-openrouter-high"
    - "gemini-3-5-flash"
    - "deepseek-v4-pro"
    - "deepseek-v3-2"
    - "mistral-large-2512"
    - "mistral-small-3-2"
    - "grok-4-20"
    - "qwen-3-6-plus"
    - "glm-5-1"
    - "kimi-k2-6"
    - "gemma-4-31b"
    - "nemotron-3-super"
    - "mimo-v2-5-pro"
  chat_latest_sonnet_smoke:
    - "gpt-chat-latest"
    - "claude-sonnet-4-6"
  aita_opus_4_8_high_smoke:
    - "claude-opus-4-8-high"
  aita_opus_4_7_high_smoke:
    - "claude-opus-4-7"
  sus_xhigh_smoke:
    - "gpt-5-5-xhigh"
    - "claude-opus-4-8-xhigh"
  claude_opus_4_8_route_smoke:
    - "claude-opus-4-8-high"
    - "claude-opus-4-8-native-high"
  claude_opus_4_8_native_effort_smoke:
    - "claude-opus-4-8-native-high"
    - "claude-opus-4-8-native-xhigh"
  # Legacy 2026-06-30 sweep. Do not use for new effort comparisons: its
  # output-token caps vary by effort, so the rows are not generation-comparable
  # under RUNBOOK §0.6. Retained so the frozen historical contract remains
  # legible.
  claude_sonnet_5_native_effort_sus_n20:
    - "claude-sonnet-5-native-low"
    - "claude-sonnet-5-native-medium"
    - "claude-sonnet-5-native-high"
    - "claude-sonnet-5-native-xhigh"
    - "claude-sonnet-5-native-max"
  # Publication replacement for the legacy Sonnet 5 sweep. The 128k cap is
  # uniform across every effort so output budget is not a hidden condition.
  claude_sonnet_5_native_effort_uniform_128k_n20:
    - "claude-sonnet-5-native-low-128k"
    - "claude-sonnet-5-native-medium-128k"
    - "claude-sonnet-5-native-high-128k"
    - "claude-sonnet-5-native-xhigh-128k"
    - "claude-sonnet-5-native-max-128k"
  claude_fable_5_native_effort_sus_n20:
    - "claude-fable-5-native-low"
    - "claude-fable-5-native-medium"
    - "claude-fable-5-native-high"
    - "claude-fable-5-native-xhigh"
    - "claude-fable-5-native-max"
  # NOTE: no provider-default arm. Anthropic documents `high` AS the Opus 5
  # default effort ("Start at the default, high"), so a no-explicit-effort arm
  # would duplicate `high` on the effort axis while differing on max_tokens
  # (unset vs 128000) — a confound, not a condition, per Amendment O2. The
  # `high` row IS the shipped-default row for this model.
  claude_opus_5_native_effort_sus_n20:
    - "claude-opus-5-native-low"
    - "claude-opus-5-native-medium"
    - "claude-opus-5-native-high"
    - "claude-opus-5-native-xhigh"
    - "claude-opus-5-native-max"
  # The four efforts not covered by the 2026-07-28 `high` probe
  # (opus5-sus-high-probe-20260728). Same comparison_spec_hash, so the two run
  # dirs combine into one 5-condition sweep at analysis time.
  claude_opus_5_native_effort_sus_remaining:
    - "claude-opus-5-native-low"
    - "claude-opus-5-native-medium"
    - "claude-opus-5-native-xhigh"
    - "claude-opus-5-native-max"
  # AITA/EPIS run at `high` only: Anthropic documents high as the Opus 5 default
  # effort, so it is the configuration an ordinary user actually gets.
  claude_opus_5_native_high_only:
    - "claude-opus-5-native-high"
  gpt_5_6_sol_native_effort:
    - "gpt-5-6-sol-native-low"
    - "gpt-5-6-sol-native-medium"
    - "gpt-5-6-sol-native-high"
    - "gpt-5-6-sol-native-xhigh"
    - "gpt-5-6-sol-native-max"
  gpt_5_6_terra_native_effort:
    - "gpt-5-6-terra-native-low"
    - "gpt-5-6-terra-native-medium"
    - "gpt-5-6-terra-native-high"
    - "gpt-5-6-terra-native-xhigh"
    - "gpt-5-6-terra-native-max"
  gpt_5_6_luna_native_effort:
    - "gpt-5-6-luna-native-low"
    - "gpt-5-6-luna-native-medium"
    - "gpt-5-6-luna-native-high"
    - "gpt-5-6-luna-native-xhigh"
    - "gpt-5-6-luna-native-max"
  gpt_5_6_canary:
    - "gpt-5-6-luna-native-low"
  gpt_5_6_sus_none:
    - "gpt-5-6-sol-native-none"
    - "gpt-5-6-terra-native-none"
    - "gpt-5-6-luna-native-none"
  provider_route_smoke:
    - "gpt-5-5-high"
    - "gpt-5-5-native-high"
    - "claude-opus-4-8-high"
    - "claude-opus-4-8-native-high"
  gemini_native_route_smoke:
    - "gemini-3-1-pro"
    - "gemini-3-1-pro-openrouter-high"
    - "gemini-3-1-pro-native-high"
    - "gemini-3-5-flash"
    - "gemini-3-5-flash-native-low"
  local_endpoint_smoke:
    - "local-openai-compatible"

models:
  claude-opus-4-6:
    model_id: "anthropic/claude-opus-4.6"
